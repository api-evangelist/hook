aid: hook
name: Hook
description: >-
  Hook is a London-based software company building AI agents for customer success
  (CS) teams. Its platform integrates product usage, revenue, support, and sales
  data to build a 360-degree view of each account, then uses predictive models to
  forecast churn, renewals, net revenue retention (NRR), and expansion up to six
  months ahead. Named agents such as Echo and Activator surface account insights
  and automate the administrative work CS teams would otherwise do by hand, helping
  subscription businesses reduce churn and grow expansion revenue without adding
  headcount. Hook is a SaaS product used by customer success and revenue teams; it
  is not a public developer API, so this profile enriches company identity and
  security posture rather than API artifacts. Surfaced as a venture-portfolio lead
  and added to the API Evangelist network.
